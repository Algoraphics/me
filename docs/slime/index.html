    <style>
      body { background: #000; }
      #start-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        background: #000;
      }
      #start-btn {
        font-family: monospace;
        font-size: 24px;
        padding: 16px 48px;
        background: transparent;
        color: #555;
        border: 2px solid #555;
        letter-spacing: 4px;
        text-transform: uppercase;
        cursor: default;
        pointer-events: none;
      }
      #start-btn.ready {
        color: #ffdf00;
        border-color: #ffdf00;
        cursor: pointer;
        pointer-events: auto;
      }
      #start-btn.ready:hover {
        background: #ffdf00;
        color: #000;
      }
      .a-enter-vr-button {
        opacity: 0.5;
      }
      .a-enter-vr-button:hover,
      .a-enter-vr-button:active {
        opacity: 1;
        background-color: rgba(0, 0, 0, 0.35) !important;
      }
      #volume-wrap {
        position: fixed;
        bottom: 10px;
        right: 80px;
        z-index: 10000;
      }
      #btn-mute {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 8px;
        opacity: 0.5;
      }
      #volume-wrap:hover #btn-mute { opacity: 1; }
      #btn-mute img { width: 30px; height: 30px; filter: invert(1); }
      #volume-slider-wrap {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      #volume-wrap:hover #volume-slider-wrap {
        opacity: 1;
        pointer-events: auto;
      }
      #volume-slider {
        writing-mode: vertical-lr;
        direction: rtl;
        width: 30px;
        height: 100px;
        accent-color: white;
        cursor: pointer;
      }
      #controls {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 10001;
        display: flex;
        align-items: center;
        gap: 0;
      }
      .ctrl-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 8px;
        opacity: 0.5;
      }
      .ctrl-btn:hover { opacity: 1; }
      .ctrl-btn img { width: 30px; height: 30px; }
      .ctrl-btn.needs-invert img { filter: invert(1); }
      #skip-chapters {
        display: flex;
        align-items: center;
        overflow: hidden;
        max-width: 0;
        transition: max-width 0.25s ease;
      }
      #skip-chapters.open { max-width: 300px; }
    </style>
  </head>

    <script>
      AFRAME.registerComponent('vr-controls', {
        init: function () {
          this.prevPressed = {};
        },
        tick: function () {
          var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (var i = 0; i < gamepads.length; i++) {
            var gp = gamepads[i];
            if (!gp) continue;
            for (var j = 0; j < gp.buttons.length; j++) {
              var key = i + '_' + j;
              var pressed = gp.buttons[j].pressed;
              if (pressed && !this.prevPressed[key]) {
                this.onButton(j);
              }
              this.prevPressed[key] = pressed;
            }
          }
        },
        onButton: function (index) {
          var scene = this.el;
          if (index === 3 || index === 5) {
            // Vive: Menu (3)  |  Quest: B/Y (5) — exit VR
            if (scene.is('vr-mode')) scene.exitVR();
          } else if (index === 2 || index === 4) {
            // Vive: Grip (2)  |  Quest: A/X (4) — pause / unpause
            document.getElementById('btn-pause').click();
          }
        }
      });

      var scene = document.getElementById('fog');

      (function () {
        var animProto = AFRAME.components.animation &&
          (AFRAME.components.animation.Component
            ? AFRAME.components.animation.Component.prototype
            : AFRAME.components.animation.prototype);
        if (animProto && animProto.tick) {
          var origTick = animProto.tick;
          animProto.tick = function (t, dt) {
            if (window.SLIME_PAUSED) return;
            origTick.call(this, t, dt);
          };
        }
      })();

      var btn = document.getElementById('start-btn');
      scene.addEventListener('loaded', function () {
        btn.classList.add('ready');
        btn.textContent = 'Start';
        document.getElementById('start-overlay').style.background = 'rgba(0, 0, 0, 0.25)';
        document.getElementById('skip-wrap').style.display = '';
      });
      function unlockAudio() {
        document.getElementById('start-overlay').style.display = 'none';
        var analyserEl = document.getElementById('analyser');
        if (analyserEl && analyserEl.components.audioanalyser && analyserEl.components.audioanalyser.analyser) {
          var ctx = analyserEl.components.audioanalyser.analyser.context;
          if (ctx && ctx.state === 'suspended') ctx.resume();
        }
        var song = document.getElementById('side');
        if (song && song.paused) {
          return song.play().then(function () { song.pause(); }).catch(function () {});
        }
        return Promise.resolve();
      }

      var RIG_Y = 1;

      function setRigY(y) {
        RIG_Y = y;
        var rig = document.getElementById('rig');
        var pos = rig.getAttribute('position');
        rig.setAttribute('position', { x: pos.x, y: y, z: pos.z });
      }

      var started = false;
      function doStart() {
        if (started) return;
        started = true;
        unlockAudio();
        var rig = document.getElementById('rig');
        var cam = document.getElementById('camera');
        document.getElementById('movingWorld').emit('start');
        emitToClass(cam, 'slide', 'speed', '0');
        rig.emit('start');
      }

      btn.addEventListener('click', doStart);

      scene.addEventListener('enter-vr', function () {
        setRigY(0);
        if (btn.classList.contains('ready')) doStart();
        var session = scene.xrSession;
        if (session) {
          session.addEventListener('visibilitychange', function () {
            if (session.visibilityState === 'hidden') scene.exitVR();
          });
        }
      });

      scene.addEventListener('exit-vr', function () {
        setRigY(1);
      });

      var BEAT_MS = 594.059;
      var isPaused = false;

      var chapters = [
        { beat: 108, camZ: -832.268, songTime: 64.736 },
        { beat: 223, camZ: -1652.060, songTime: 133.029 },
        { beat: 327, camZ: -2393.396, songTime: 194.827 },
        { beat: 392, camZ: -2800, songTime: 233.5 }
      ];

      var pauseBtn = document.getElementById('btn-pause');
      pauseBtn.addEventListener('click', function () {
        var song = document.getElementById('side');
        var musicMgrEl = document.querySelector('[music-manager]');
        var mm = musicMgrEl && musicMgrEl.components['music-manager'];

        if (isPaused) {
          window.SLIME_PAUSED = false;
          if (song && mm && mm.started) song.play();
          isPaused = false;
          pauseBtn.querySelector('img').src = '../websiteIcons/PauseWhite.png';
        } else {
          window.SLIME_PAUSED = true;
          if (song) song.pause();
          isPaused = true;
          pauseBtn.querySelector('img').src = '../websiteIcons/PlayWhite.png';
        }
      });

      var skipChapters = document.getElementById('skip-chapters');
      document.getElementById('btn-skip-toggle').addEventListener('click', function () {
        skipChapters.classList.toggle('open');
      });

      var muteBtn = document.getElementById('btn-mute');
      var volumeSlider = document.getElementById('volume-slider');
      var preMuteVolume = 25;
      var sideAudio = document.getElementById('side');
      if (sideAudio) sideAudio.volume = 0.25;

      function updateVolumeIcon(song) {
        muteBtn.querySelector('img').src = song.muted || song.volume === 0
          ? '../websiteIcons/volume-xmark-solid.png'
          : '../websiteIcons/volume-solid.png';
      }

      muteBtn.addEventListener('click', function () {
        var song = document.getElementById('side');
        if (song) {
          song.muted = !song.muted;
          if (!song.muted && song.volume === 0) {
            song.volume = preMuteVolume / 100 || 1;
            volumeSlider.value = Math.round(song.volume * 100);
          }
          updateVolumeIcon(song);
        }
      });

      volumeSlider.addEventListener('input', function () {
        var song = document.getElementById('side');
        if (!song) return;
        var vol = parseInt(this.value, 10) / 100;
        if (vol > 0) preMuteVolume = this.value;
        song.volume = vol;
        song.muted = false;
        updateVolumeIcon(song);
      });

      var chapterBtns = document.querySelectorAll('.chapter-btn');
      for (var i = 0; i < chapterBtns.length; i++) {
        chapterBtns[i].addEventListener('click', function () {
          var idx = parseInt(this.getAttribute('data-chapter'));
          unlockAudio().then(function () { skipToChapter(idx); });
        });
      }

      function skipToChapter(idx) {
        document.getElementById('skip-wrap').style.display = 'none';
        skipChapters.classList.remove('open');

        var ch = chapters[idx];
        if (!ch.camZ) {
          console.error('[skip] chapter ' + idx + ' has no snapshot data');
          return;
        }

        var song = document.getElementById('side');
        var rig = document.getElementById('rig');
        var cam = document.getElementById('camera');
        var overlay = document.getElementById('start-overlay');
        var overlayBtn = document.getElementById('start-btn');

        window.SLIME_PAUSED = true;
        isPaused = false;
        pauseBtn.querySelector('img').src = '../websiteIcons/PauseWhite.png';
        if (song) song.pause();

        overlay.style.display = 'flex';
        overlay.style.background = 'rgba(0, 0, 0, 0.9)';
        overlayBtn.textContent = 'Loading...';
        overlayBtn.classList.remove('ready');
        overlayBtn.style.pointerEvents = 'none';

        var slides = document.querySelectorAll('.slide');
        for (var i = 0; i < slides.length; i++) {
          slides[i].speed = 0;
        }

        var mw = document.getElementById('movingWorld');
        if (mw) mw.emit('start');
        emitToClass(cam, 'slide', 'speed', '0');
        rig.emit('start');
        rig.setAttribute('position', { x: 0, y: RIG_Y, z: ch.camZ });

        forceLoadWorldbuilders();
        if (idx === 3) forceLoadAsteroids();

        for (var b = 0; b <= ch.beat; b++) {
          var els = scene.querySelectorAll('.beatlistener' + b);
          for (var j = 0; j < els.length; j++) {
            els[j].emit('beat', b, false);
          }
          if (b === 135) {
            scene.emit('beat');
          }
        }

        if (ch.beat >= 135) {
          scene.removeAttribute('animation__fog');
          scene.setAttribute('fog', 'density', 0);
        }

        if (idx >= 1) {
          var starcolor = document.querySelector('#starcolor');
          if (starcolor) {
            starcolor.removeAttribute('animation__opacity');
            starcolor.getObject3D('mesh').material.opacity = 0.4;
          }
        }

        if (idx === 3) {
          var removals = ['#boxleft', '#boxright', '#boxfront', '#boxback',
                          '#gridleft', '#gridright', '#floor', '#floorleft',
                          '#flooright', '#road',
                          '#ringportal', '#buildingportal', '#discotunnel',
                          '#electrictunnel', '#kaltunnel'];
          for (var r = 0; r < removals.length; r++) {
            var el = document.querySelector(removals[r]);
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }
          var snakes = document.querySelectorAll('[rng-building-snakes], [rng-building-snake]');
          for (var s = 0; s < snakes.length; s++) {
            if (snakes[s].parentNode) snakes[s].parentNode.removeChild(snakes[s]);
          }
          var sunsky = document.querySelector('#sunsky');
          if (sunsky) sunsky.setAttribute('visible', false);
          var gotospaceEl = document.querySelector('[gotospace]');
          if (gotospaceEl && gotospaceEl.blastoff !== undefined) gotospaceEl.blastoff = false;
        }

        var musicMgrEl = document.querySelector('[music-manager]');
        if (musicMgrEl && musicMgrEl.components['music-manager']) {
          var mm = musicMgrEl.components['music-manager'];
          mm.started = true;
          mm.beatcount = ch.beat + 1;
          mm.time = (ch.beat + 1) * BEAT_MS;
          mm.beatbar = (ch.beat + 2) * BEAT_MS;
        }

        if (song) {
          song.currentTime = ch.songTime;
        }

        snapAnimations();

        if (idx === 3) {
          var starcolor = document.querySelector('#starcolor');
          if (starcolor && starcolor.parentNode) starcolor.parentNode.removeChild(starcolor);
        }

        var skipIdx = idx;
        setTimeout(function () {
          overlay.style.display = 'none';
          if (song) song.play().catch(function () {});
          window.SLIME_PAUSED = false;
          if (skipIdx === 3) {
            requestAnimationFrame(function () {
              var audioReactEls = document.querySelectorAll('[audio-react]');
              for (var i = 0; i < audioReactEls.length; i++) {
                audioReactEls[i].started = true;
                audioReactEls[i].setAttribute('class', 'beatlistener464');
              }
            });
          }
        }, 500);
      }

      function forceLoadAsteroids() {
        window.SLIME_PAUSED = false;
        try {
          var els = document.querySelectorAll('[rng-asteroids]');
          for (var i = 0; i < els.length; i++) {
            var comp = els[i].components['rng-asteroids'];
            if (comp && comp.tick) comp.tick();
          }
        } finally {
          window.SLIME_PAUSED = true;
        }
      }

      function forceLoadWorldbuilders() {
        window.SLIME_PAUSED = false;
        try {
          var wbs = document.querySelectorAll('[worldbuilder]');
          for (var i = 0; i < wbs.length; i++) {
            var wb = wbs[i].components.worldbuilder;
            if (wb && wb.loading) {
              wbs[i].loadbar = Infinity;
              var safety = 0;
              while (wb.loading && safety < 50000) {
                wb.tick(0, 0);
                safety++;
              }
            }
          }
        } finally {
          window.SLIME_PAUSED = true;
        }
      }

      function snapAnimations() {
        var allEls = scene.querySelectorAll('*');
        for (var i = 0; i < allEls.length; i++) {
          var comps = allEls[i].components;
          if (!comps) continue;
          for (var key in comps) {
            if (key.indexOf('animation') !== 0) continue;
            var anim = comps[key];
            if (!anim || !anim.data || !anim.animationIsPlaying) continue;
            if (anim.data.loop) continue;
            var prop = anim.data.property;
            var to = anim.data.to;
            try {
              var parts = prop.split('.');
              if (parts[0] === 'components') {
                var obj = allEls[i];
                for (var p = 0; p < parts.length - 1; p++) obj = obj[parts[p]];
                obj[parts[parts.length - 1]] = parseFloat(to);
              } else if (parts.length === 1) {
                allEls[i].setAttribute(parts[0], to);
              } else {
                allEls[i].setAttribute(parts[0], parts[1], to);
              }
            } catch (e) {}
            anim.animationIsPlaying = false;
          }
        }
      }
    </script>
  </body>
</html>
